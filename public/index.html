<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Quitar "noindex" al pasar a producción con el dominio propio -->
  <meta name="robots" content="noindex, nofollow">
  <title>Cantina Ensenada · Mexikanisches Restaurant in Passau</title>
  <meta name="description" content="Mexikanisches Restaurant in der Passauer Innstadt: Tacos, Margaritas, gute Stimmung und Spiele am Tisch.">
  <meta name="theme-color" content="#0b2a33">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/shrikhand.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/web.css">
</head>
<body>
  <header class="cabecera">
    <div class="envoltura">
      <a class="logo" href="#inicio" data-nombre-logo>Cantina <span>Ensenada</span></a>
      <button class="nav-boton" type="button" aria-expanded="false" aria-controls="nav" data-i18n-aria="nav.menu">☰</button>
      <nav class="nav" id="nav">
        <a href="#carta" data-i18n="nav.carta">Carta</a>
        <a href="#galeria" data-i18n="nav.galeria">Galería</a>
        <a href="#visitanos" data-i18n="nav.visitanos">Visítanos</a>
        <a href="juegos/" class="destacado">🎲 <span data-i18n="nav.juegos">Juegos</span></a>
      </nav>
      <div data-idiomas></div>
    </div>
  </header>

  <main>
    <section class="hero" id="inicio">
      <div class="papel-picado" data-papel-picado="24" aria-hidden="true"></div>
      <div class="flotan" aria-hidden="true">
        <span style="left:6%;top:30%">🌮</span>
        <span style="left:86%;top:24%;animation-delay:-2s">🌶️</span>
        <span style="left:12%;top:72%;animation-delay:-4s">🍹</span>
        <span style="left:80%;top:62%;animation-delay:-1s">🥑</span>
        <span style="left:48%;top:86%;animation-delay:-3s;font-size:2rem">🍋</span>
      </div>
      <div class="envoltura">
        <span class="hero-eyebrow" data-i18n="hero.eyebrow">Cocina mexicana · Passau</span>
        <h1 data-nombre-titulo>Cantina <span>Ensenada</span></h1>
        <p class="hero-lema" data-i18n="hero.lema"></p>
        <div class="hero-botones">
          <a class="boton amarillo" href="#carta">🌮 <span data-i18n="hero.verCarta"></span></a>
          <a class="boton" href="juegos/">🎲 <span data-i18n="hero.jugar"></span></a>
          <a class="boton contorno" href="#" target="_blank" rel="noopener" data-reserva>📅 <span data-i18n="hero.reservar"></span></a>
        </div>
      </div>
      <svg class="sello" viewBox="0 0 120 120" aria-hidden="true">
        <defs><path id="circulo" d="M60 60m-46 0a46 46 0 1 1 92 0a46 46 0 1 1 -92 0"/></defs>
        <circle cx="60" cy="60" r="58" fill="var(--chile)"/>
        <circle cx="60" cy="60" r="34" fill="none" stroke="var(--sol)" stroke-dasharray="3 4"/>
        <text><textPath href="#circulo" data-i18n="sello"></textPath></text>
        <text x="60" y="70" text-anchor="middle" style="font-size:30px;letter-spacing:0">💀</text>
      </svg>
      <svg class="hero-ola" viewBox="0 0 1440 70" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 40C180 70 360 10 540 30S900 70 1080 40 1360 10 1440 30V70H0Z" fill="var(--crema)"/>
      </svg>
    </section>

    <section class="banda-juegos" id="juegos">
      <div class="envoltura">
        <div class="banda-caja aparece">
          <h2 data-i18n="banda.titulo"></h2>
          <p data-i18n="banda.texto"></p>
          <div class="banda-tarjetas">
            <div class="banda-tarjeta" style="--c:var(--cempasuchil)"><span class="ico">🏆</span><b data-i18n="banda.c1t"></b><p data-i18n="banda.c1d"></p></div>
            <div class="banda-tarjeta" style="--c:var(--rosa)"><span class="ico">📚</span><b data-i18n="banda.c2t"></b><p data-i18n="banda.c2d"></p></div>
            <div class="banda-tarjeta" style="--c:var(--mar-claro)"><span class="ico">🪅</span><b data-i18n="banda.c3t"></b><p data-i18n="banda.c3d"></p></div>
          </div>
          <a class="boton amarillo" href="juegos/">🎲 <span data-i18n="banda.cta"></span></a>
        </div>
      </div>
    </section>

    <section class="seccion" id="carta">
      <div class="envoltura">
        <div class="seccion-cabeza aparece">
          <span class="adorno" aria-hidden="true">🌶️🌮🌶️</span>
          <h2 data-i18n="carta.titulo"></h2>
          <p data-i18n="carta.sub"></p>
        </div>
        <p class="aviso-demo" data-aviso-demo hidden data-i18n="demo.aviso"></p>
        <div class="carta-pestanas" role="tablist" data-pestanas></div>
        <div class="carta-lista" data-carta role="tabpanel"></div>
        <p class="carta-nota" data-i18n="carta.alergenos"></p>
      </div>
    </section>

    <section class="seccion galeria" id="galeria">
      <div class="envoltura">
        <div class="seccion-cabeza aparece">
          <span class="adorno" aria-hidden="true">✨📸✨</span>
          <h2 data-i18n="galeria.titulo"></h2>
          <p data-i18n="galeria.sub"></p>
        </div>
        <div class="galeria-rejilla" data-galeria></div>
        <div class="galeria-ig"><a class="boton claro" href="#" target="_blank" rel="noopener" data-instagram>📷 <span data-instagram-usuario></span></a></div>
      </div>
    </section>

    <section class="seccion" id="visitanos">
      <div class="envoltura">
        <div class="seccion-cabeza aparece">
          <span class="adorno" aria-hidden="true">📍</span>
          <h2 data-i18n="visita.titulo"></h2>
        </div>
        <div class="visita-rejilla">
          <div class="tarjeta aparece" style="--c:var(--rosa)">
            <h3 data-i18n="visita.direccion"></h3>
            <p data-direccion></p>
            <a class="boton" href="#" target="_blank" rel="noopener" data-maps>🗺️ <span data-i18n="visita.llegar"></span></a>
          </div>
          <div class="tarjeta aparece" style="--c:var(--cempasuchil)">
            <h3 data-i18n="visita.horario"></h3>
            <table class="horario"><tbody data-horario></tbody></table>
          </div>
          <div class="tarjeta aparece" style="--c:var(--mar-claro)">
            <h3 data-i18n="visita.contacto"></h3>
            <p><a href="#" data-telefono></a></p>
            <a class="boton amarillo" href="#" target="_blank" rel="noopener" data-reserva>📅 <span data-i18n="visita.reservar"></span></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="papel-picado" data-papel-picado="24" aria-hidden="true" style="background:var(--noche)"></div>
  <footer class="pie">
    <div class="envoltura">
      <span class="logo" data-nombre-logo>Cantina <span>Ensenada</span></span>
      <nav>
        <a href="#" data-i18n="pie.impressum"></a>
        <a href="#" data-i18n="pie.privacidad"></a>
        <a href="juegos/" data-i18n="nav.juegos"></a>
      </nav>
      <span data-i18n="pie.hecho"></span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/web.js"></script>
</body>
</html>
