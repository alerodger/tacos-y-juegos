<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Quitar "noindex" al pasar a producción con el dominio propio -->
  <meta name="robots" content="noindex, nofollow">
  <title>Cantina Ensenada · Cocina Mexicana &amp; Tequila Bar · Passau</title>
  <meta name="description" content="Mexikanisches Restaurant und Tequila Bar in der Passauer Innstadt: Tacos, Mole, Margaritas, über 20 Tequilas und Spiele am Tisch.">
  <meta name="theme-color" content="#0d0a08">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/bebas.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fotos/barra-catrina.webp" as="image">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/web.css">
</head>
<body>
  <header class="cabecera">
    <div class="envoltura">
      <a class="logo" href="#inicio"><img src="assets/logo.png" alt="Cantina Ensenada" width="56" height="56" data-nombre-alt></a>
      <button class="nav-boton" type="button" aria-expanded="false" aria-controls="nav" data-i18n-aria="nav.menu">☰</button>
      <nav class="nav" id="nav">
        <a href="#carta" data-i18n="nav.carta">Carta</a>
        <a href="#tequila" data-i18n="nav.bar">Bar</a>
        <a href="#galeria" data-i18n="nav.galeria">Galería</a>
        <a href="#visitanos" data-i18n="nav.visitanos">Visítanos</a>
        <a href="juegos/" class="destacado">🎲 <span data-i18n="nav.juegos">Juegos</span></a>
      </nav>
      <div data-idiomas></div>
    </div>
  </header>

  <main>
    <section class="hero" id="inicio">
      <div class="hero-foto"><img src="assets/fotos/barra-catrina.webp" alt="" fetchpriority="high"></div>
      <div class="papel-picado" data-papel-picado="30" aria-hidden="true"></div>
      <div class="envoltura hero-contenido">
        <h1 class="marca">
          <svg class="marca-sol" viewBox="0 0 80 46" aria-hidden="true"><g fill="var(--rojo)">
            <path d="M40 44L37.5 9 40 2l2.5 7Z" transform="rotate(-72 40 44)"/><path d="M40 44L37.5 9 40 2l2.5 7Z" transform="rotate(-48 40 44)"/>
            <path d="M40 44L37.5 9 40 2l2.5 7Z" transform="rotate(-24 40 44)"/><path d="M40 44L37.5 9 40 2l2.5 7Z"/>
            <path d="M40 44L37.5 9 40 2l2.5 7Z" transform="rotate(24 40 44)"/><path d="M40 44L37.5 9 40 2l2.5 7Z" transform="rotate(48 40 44)"/>
            <path d="M40 44L37.5 9 40 2l2.5 7Z" transform="rotate(72 40 44)"/><path d="M27 45a13 13 0 0 1 26 0Z"/></g></svg>
          <span class="marca-1" data-nombre-1>Cantina</span>
          <span class="marca-2" data-nombre-2>Ensenada</span>
          <span class="marca-3" data-eslogan>Cocina mexicana <b>&amp;</b> tequila bar</span>
        </h1>
        <p class="hero-lema" data-i18n="hero.lema"></p>
        <div class="hero-botones">
          <a class="boton" href="#" target="_blank" rel="noopener" data-reserva>📅 <span data-i18n="hero.reservar"></span></a>
          <a class="boton amarillo" href="#carta">🌮 <span data-i18n="hero.verCarta"></span></a>
          <a class="boton neon" href="juegos/">🎲 <span data-i18n="hero.jugar"></span></a>
        </div>
        <div class="hero-datos">
          <a class="valoracion" href="#" target="_blank" rel="noopener" data-valoracion hidden></a>
          <a class="apertura" href="#visitanos" data-apertura hidden></a>
        </div>
      </div>
    </section>

    <section class="seccion" id="imprescindibles">
      <div class="envoltura">
        <div class="seccion-cabeza aparece">
          <span class="antetitulo" data-i18n="dest.ante"></span>
          <h2 data-i18n="dest.titulo"></h2>
        </div>
        <div class="destacados" data-destacados></div>
      </div>
    </section>

    <section class="banda-juegos" id="juegos">
      <div class="envoltura">
        <div class="banda-caja aparece">
          <span class="antetitulo" data-i18n="banda.ante"></span>
          <h2 class="neon" data-i18n="banda.titulo"></h2>
          <p data-i18n="banda.texto"></p>
          <div class="banda-tarjetas">
            <div class="banda-tarjeta" style="--c:var(--vela)"><span class="ico">🏆</span><b data-i18n="banda.c1t"></b><p data-i18n="banda.c1d"></p></div>
            <div class="banda-tarjeta" style="--c:var(--rosa)"><span class="ico">🥃</span><b data-i18n="banda.c3t"></b><p data-i18n="banda.c3d"></p></div>
            <div class="banda-tarjeta" style="--c:var(--cian)"><span class="ico">📚</span><b data-i18n="banda.c2t"></b><p data-i18n="banda.c2d"></p></div>
          </div>
          <a class="boton amarillo" href="juegos/">🎲 <span data-i18n="banda.cta"></span></a>
        </div>
      </div>
    </section>

    <section class="seccion carta" id="carta">
      <div class="envoltura">
        <div class="seccion-cabeza aparece">
          <span class="antetitulo" data-i18n="carta.ante"></span>
          <h2 data-i18n="carta.titulo"></h2>
          <p data-i18n="carta.sub"></p>
        </div>
        <p class="aviso-demo" data-aviso-demo hidden data-i18n="demo.aviso"></p>
        <div class="carta-grupos" role="group" data-grupos>
          <button type="button" data-grupo="comida">🌮 <span data-i18n="carta.comida"></span></button>
          <button type="button" data-grupo="bebida">🍹 <span data-i18n="carta.bebida"></span></button>
        </div>
        <div class="carta-pestanas" role="tablist" data-pestanas></div>
        <p class="carta-nota-cat" data-nota-cat hidden></p>
        <div class="carta-lista" data-carta role="tabpanel"></div>
        <p class="carta-nota" data-i18n="carta.alergenos"></p>
      </div>
    </section>

    <section class="tequila" id="tequila">
      <div class="tequila-foto"><img src="assets/fotos/comedor-sombreros.webp" alt="" loading="lazy"></div>
      <div class="envoltura">
        <div class="tequila-texto aparece">
          <span class="antetitulo" data-i18n="bar.ante"></span>
          <h2><span class="neon" data-i18n="bar.titulo1"></span><br><span class="rojo" data-i18n="bar.titulo2"></span></h2>
          <p data-i18n="bar.texto"></p>
          <div class="cifras">
            <div><b data-cifra-tequilas>20+</b><span data-i18n="bar.c1"></span></div>
            <div><b data-cifra-cocteles>40+</b><span data-i18n="bar.c2"></span></div>
            <div><b>6</b><span data-i18n="bar.c3"></span></div>
          </div>
          <div><a class="boton" href="#carta" data-ir-carta="cocteles">🍹 <span data-i18n="bar.cta"></span></a></div>
        </div>
      </div>
    </section>

    <section class="seccion" id="galeria">
      <div class="envoltura">
        <div class="seccion-cabeza aparece">
          <span class="antetitulo" data-i18n="galeria.ante"></span>
          <h2 data-i18n="galeria.titulo"></h2>
          <p data-i18n="galeria.sub"></p>
        </div>
        <div class="galeria-rejilla" data-galeria></div>
        <div class="galeria-ig"><a class="boton claro" href="#" target="_blank" rel="noopener" data-instagram>📷 <span data-instagram-usuario></span></a></div>
      </div>
    </section>

    <section class="seccion" id="visitanos">
      <div class="envoltura">
        <div class="seccion-cabeza aparece">
          <span class="antetitulo">📍 Passau · Innstadt</span>
          <h2 data-i18n="visita.titulo"></h2>
        </div>
        <div class="visita-rejilla">
          <div class="tarjeta aparece" style="--c:var(--rojo)">
            <h3 data-i18n="visita.direccion"></h3>
            <p data-direccion></p>
            <a class="boton" href="#" target="_blank" rel="noopener" data-maps>🗺️ <span data-i18n="visita.llegar"></span></a>
          </div>
          <div class="tarjeta aparece" style="--c:var(--vela)">
            <h3 data-i18n="visita.horario"></h3>
            <p class="apertura-tarjeta" data-apertura hidden></p>
            <table class="horario"><tbody data-horario></tbody></table>
            <small data-i18n="visita.horarioNota"></small>
          </div>
          <div class="tarjeta aparece" style="--c:var(--cian)">
            <h3 data-i18n="visita.contacto"></h3>
            <p><a href="#" data-telefono></a></p>
            <a class="boton amarillo" href="#" target="_blank" rel="noopener" data-reserva>📅 <span data-i18n="visita.reservar"></span></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="papel-picado" data-papel-picado="30" aria-hidden="true" style="background:#000"></div>
  <footer class="pie">
    <div class="envoltura">
      <a class="logo" href="#inicio"><img src="assets/logo.png" alt="Cantina Ensenada" width="84" height="84" loading="lazy"></a>
      <nav>
        <a href="legal/impressum.html" data-i18n="pie.impressum"></a>
        <a href="legal/datenschutz.html" data-i18n="pie.privacidad"></a>
        <a href="juegos/" data-i18n="nav.juegos"></a>
      </nav>
      <span data-i18n="pie.hecho"></span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/web.js"></script>
</body>
</html>
